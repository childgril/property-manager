<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>權狀管理系統</title>
<!-- sql.js：在瀏覽器跑的 SQLite，資料存本機 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
  :root {
    --bg: #0f1419; --surface: #1a212b; --surface-2: #232d3a; --border: #2e3a47;
    --text: #e6edf3; --text-dim: #8b98a8; --accent: #4a9eff; --accent-dim: #2d5a8c;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --purple: #a371f7;
    --land: #d8a657; --building: #7aa2f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .logo { padding: 0 18px 16px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .logo h1 { font-size: 15px; font-weight: 700; }
  .logo .sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--text-dim); cursor: pointer; border-left: 2px solid transparent; font-size: 13px; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface-2); }
  .nav-item .icon { width: 16px; text-align: center; }
  .data-tools { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--border); }
  .data-tools .lbl { font-size: 10px; color: #5a6675; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .data-btn { display: block; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-bottom: 6px; }
  .data-btn:hover { border-color: var(--accent); }
  .data-status { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
  .main { flex: 1; overflow-x: hidden; }
  .topbar { height: 54px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: var(--surface); position: sticky; top: 0; z-index: 10; }
  .topbar .crumb { font-size: 13px; color: var(--text-dim); }
  .topbar .crumb b { color: var(--text); }
  .content { padding: 22px; }
  .page { display: none; } .page.active { display: block; }
  h2.page-title { font-size: 19px; font-weight: 700; margin-bottom: 3px; }
  .page-desc { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; color: var(--text-dim); background: none; }
  .chip.on { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }
  .search { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 7px; font-size: 13px; width: 200px; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 7px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn.danger { background: var(--red); }
  .btn:hover { opacity: 0.9; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .card-head { padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-head h3 { font-size: 14px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--text-dim); font-weight: 600; padding: 9px 16px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 11px 16px; border-top: 1px solid var(--border); font-size: 13px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }
  .mono { font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.land { background: rgba(216,166,87,0.16); color: var(--land); }
  .badge.building { background: rgba(122,162,247,0.16); color: var(--building); }
  .badge.held { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.sold { background: rgba(139,152,168,0.15); color: var(--text-dim); }
  .badge.split { background: rgba(163,113,247,0.15); color: var(--purple); }
  .badge.merged { background: rgba(163,113,247,0.15); color: var(--purple); }
  .empty { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .empty .big { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .label { font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .stat .value { font-size: 22px; font-weight: 700; }
  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 640px; }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 16px; }
  .modal-head .x { cursor: pointer; color: var(--text-dim); font-size: 22px; line-height: 1; background: none; border: none; }
  .modal-body { padding: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--text-dim); }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 7px; font-size: 13px; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 10px; color: #5a6675; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .section-label { grid-column: 1/-1; font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border); border-radius: 8px; overflow: hidden; }
  .detail-grid .cell { background: var(--surface); padding: 11px 14px; }
  .detail-grid .k { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .detail-grid .v { font-size: 14px; }
  .back-link { color: var(--accent); cursor: pointer; font-size: 13px; margin-bottom: 12px; display: inline-block; background: none; border: none; }
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .tl-item { position: relative; padding-bottom: 14px; }
  .tl-item::before { content: ''; position: absolute; left: -19px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .tl-item .date { font-size: 11px; color: var(--text-dim); }
  .tl-item .ev { font-size: 13px; margin-top: 1px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; transform: translateY(10px); transition: all 0.25s; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { background: var(--red); }
  .loading { text-align: center; padding: 60px; color: var(--text-dim); }
  .note { background: rgba(74,158,255,0.08); border: 1px solid var(--accent-dim); border-radius: 8px; padding: 11px 14px; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  .icon-btn:hover { border-color: var(--accent); color: var(--text); }
  .icon-btn.del:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div id="boot" class="loading">系統載入中…（首次開啟需下載 SQLite 引擎，約數秒）</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="logo"><h1>權狀管理系統</h1><div class="sub">第一版 · 權狀 CRUD · 本機資料</div></div>
    <div class="nav-item active" data-page="dashboard"><span class="icon">▣</span><span>總覽</span></div>
    <div class="nav-item" data-page="lands"><span class="icon" style="color:var(--land)">▦</span><span>土地權狀</span></div>
    <div class="nav-item" data-page="buildings"><span class="icon" style="color:var(--building)">▦</span><span>建物權狀</span></div>
    <div class="data-tools">
      <div class="lbl">資料（存於本機）</div>
      <button class="data-btn" id="btnSave">💾 儲存到檔案（.db）</button>
      <button class="data-btn" id="btnLoad">📂 載入 .db 檔</button>
      <button class="data-btn" id="btnSeed">🌱 載入範例資料</button>
      <input type="file" id="fileInput" accept=".db,.sqlite" style="display:none">
      <div class="data-status" id="dataStatus">未儲存的變更會留在瀏覽器</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><div class="crumb" id="crumb">總覽</div></div>
    <div class="content">
      <div class="page active" id="dashboard"></div>
      <div class="page" id="lands"></div>
      <div class="page" id="buildings"></div>
      <div class="page" id="deedDetail"></div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="forms.js"></script>
</body>
</html>
